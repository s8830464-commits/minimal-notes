name: Build iOS IPA

on:
  push:
    branches: [main, master, "codex/notes-ios27-fixes"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      EXPECTED_IOS_SDK: "27.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Xcode and target SDK
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Test and build unsigned IPA
        run: bash scripts/build_ipa.sh

      - name: Upload verified unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NotesApp-1.0.1-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
