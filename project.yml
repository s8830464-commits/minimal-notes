name: NotesApp
options:
  bundleIdPrefix: com.ivan
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
targets:
  NotesApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: NotesApp
        PRODUCT_BUNDLE_IDENTIFIER: com.ivan.minimalnotes
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
