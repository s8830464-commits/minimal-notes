name: NotesApp
options:
  bundleIdPrefix: com.ivan
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  NotesApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: NotesApp
        PRODUCT_BUNDLE_IDENTIFIER: com.ivan.minimalnotes
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
  NotesAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Tests
    dependencies:
      - target: NotesApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ivan.minimalnotes.tests
schemes:
  NotesApp:
    build:
      targets:
        NotesApp: all
    test:
      targets:
        - NotesAppTests
