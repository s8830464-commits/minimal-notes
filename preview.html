<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotesApp Preview - iOS Simulator</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap');

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Plus Jakarta Sans", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .font-serif-ios {
      font-family: "Playfair Display", "New York", Georgia, serif;
    }
    .font-mono-ios {
      font-family: "JetBrains Mono", SFMono-Regular, Menlo, Monaco, monospace;
    }

    /* Apple Spring Motion Easings */
    :root {
      --spring-apple: cubic-bezier(0.2, 0.9, 0.22, 1);
      --spring-bouncy: cubic-bezier(0.34, 1.45, 0.64, 1);
      --spring-press: cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Screen transition states */
    .screen-view {
      transition: transform 0.36s var(--spring-apple), opacity 0.36s ease, filter 0.36s ease;
      will-change: transform, opacity;
    }

    .list-hidden-back {
      transform: translateX(-24%) scale(0.96);
      opacity: 0.5;
      filter: brightness(0.8);
      pointer-events: none;
    }

    .detail-hidden-right {
      transform: translateX(100%);
      pointer-events: none;
      opacity: 0;
    }

    .detail-active {
      transform: translateX(0);
      pointer-events: auto;
      opacity: 1;
    }

    /* Apple Spring Press Feedback */
    .apple-press {
      transition: transform 0.22s var(--spring-press), opacity 0.22s ease;
      will-change: transform;
    }
    .apple-press:active {
      transform: scale(0.91);
      opacity: 0.82;
    }

    /* Row item press */
    .apple-row {
      transition: transform 0.2s var(--spring-press), background-color 0.15s ease;
      will-change: transform;
    }
    .apple-row:active {
      transform: scale(0.985);
    }

    /* Gear Rotation */
    .gear-rotate {
      transition: transform 0.4s var(--spring-bouncy);
      will-change: transform;
    }
    .gear-rotate:active {
      transform: rotate(60deg) scale(0.88);
    }

    /* Modal Sheet */
    .ios-sheet {
      transition: transform 0.38s var(--spring-apple);
      will-change: transform;
    }
    .ios-sheet.hidden-sheet {
      transform: translateY(105%);
      pointer-events: none;
    }
    .ios-sheet.visible-sheet {
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Sheet Backdrop Overlay */
    .sheet-backdrop {
      transition: opacity 0.32s ease;
      will-change: opacity;
    }

    /* iOS smooth scroll */
    .ios-scroll::-webkit-scrollbar {
      display: none;
    }
    .ios-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

  <script>
    // State
    let isDarkMode = false;
    let currentNoteId = null;
    let notes = [
      {
        id: "1",
        text: "Добро пожаловать в Заметки ✨\n\nЭто минималистичное и быстрое приложение:\n\n• Первая строка автоматически становится заголовком.\n• Свайп вправо закрепляет заметку.\n• Свайп влево удаляет заметку.\n• Все данные хранятся локально.",
        isPinned: true,
        date: "14:20"
      },
      {
        id: "2",
        text: "Список покупок к выходным\n\n1. Молоко овсяное\n2. Свежий кофе в зернах\n3. Сыр пармезан\n4. Зелень и руккола",
        isPinned: false,
        date: "Вчера"
      },
      {
        id: "3",
        text: "Идеи для нового проекта\n\nСделать красивый предпросмотр в стиле iPhone для быстрой оценки дизайна и эргономики.",
        isPinned: false,
        date: "9 окт"
      }
    ];

    let settings = {
      fontStyle: 'sans',
      fontSize: 17,
      readOnly: false
    };

    // DOM Elements
    const screen = document.getElementById('screen');
    const listView = document.getElementById('listView');
    const detailView = document.getElementById('detailView');
    const settingsSheet = document.getElementById('settingsSheet');
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const sheetHeader = document.getElementById('sheetHeader');
    const sheetGrabber = document.getElementById('sheetGrabber');
    const notesContainer = document.getElementById('notesContainer');
    const searchInput = document.getElementById('searchInput');
    const noteTextarea = document.getElementById('noteTextarea');
    const wordCharStats = document.getElementById('wordCharStats');
    const dateModifiedText = document.getElementById('dateModifiedText');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const fontStyleSelect = document.getElementById('fontStyleSelect');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeDisplay = document.getElementById('fontSizeDisplay');
    const readOnlyToggle = document.getElementById('readOnlyToggle');
    const copyAllTextBtn = document.getElementById('copyAllTextBtn');
    const copyToast = document.getElementById('copyToast');
    const cleanWhitespaceBtn = document.getElementById('cleanWhitespaceBtn');
    const fixErrorsNotice = document.getElementById('fixErrorsNotice');
    const statChars = document.getElementById('statChars');
    const statWords = document.getElementById('statWords');
    const statReadingTime = document.getElementById('statReadingTime');
    const toggleThemeBtn = document.getElementById('toggleThemeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    const newNoteBtn = document.getElementById('newNoteBtn');
    const backToListBtn = document.getElementById('backToListBtn');
    const deleteDetailBtn = document.getElementById('deleteDetailBtn');
    const doneEditingBtn = document.getElementById('doneEditingBtn');
    const resetDemoBtn = document.getElementById('resetDemoBtn');

    // Render Note List with smooth Apple row hover/active
    function renderNotes() {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = notes.filter(n => n.text.toLowerCase().includes(query));

      const pinned = filtered.filter(n => n.isPinned);
      const other = filtered.filter(n => !n.isPinned);

      notesContainer.innerHTML = '';

      if (filtered.length === 0) {
        notesContainer.innerHTML = `
          <div class="py-16 flex flex-col items-center justify-center text-neutral-500">
            <svg class="w-12 h-12 stroke-[1.2] stroke-current fill-none mb-2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
            </svg>
            <span class="text-sm font-medium">Ничего не найдено</span>
          </div>
        `;
        return;
      }

      function createSection(title, list) {
        if (list.length === 0) return '';
        let html = `<div>`;
        if (title) {
          html += `<div class="text-[11px] font-semibold tracking-wide text-[var(--text-secondary)] uppercase px-2 mb-1.5">${title}</div>`;
        }
        html += `<div class="bg-[var(--card-bg)] rounded-2xl divide-y divide-[var(--divider-color)] overflow-hidden shadow-sm border border-[var(--border-color)]">`;
        list.forEach(note => {
          const lines = note.text.split('\n').filter(l => l.trim().length > 0);
          const noteTitle = lines[0] || 'Новая заметка';
          const noteBody = lines[1] || 'Нет дополнительного текста';

          html += `
            <div onclick="openNote('${note.id}')" class="apple-row p-3.5 hover:bg-neutral-800/40 cursor-pointer flex items-start justify-between group">
              <div class="flex-1 min-w-0 pr-3">
                <div class="flex items-center gap-1.5">
                  ${note.isPinned ? '<span class="text-orange-500 text-xs">📌</span>' : ''}
                  <span class="font-semibold text-sm text-[var(--text-primary)] truncate">${escapeHtml(noteTitle)}</span>
                </div>
                <div class="flex items-center gap-2 text-xs text-[var(--text-secondary)] mt-1 truncate">
                  <span class="font-medium shrink-0">${note.date}</span>
                  <span class="truncate">${escapeHtml(noteBody)}</span>
                </div>
              </div>
              <span class="text-[var(--text-secondary)] text-xs font-bold pt-1">›</span>
            </div>
          `;
        });
        html += `</div></div>`;
        return html;
      }

      let contentHtml = '';
      if (pinned.length > 0) contentHtml += createSection('Закреплённые', pinned);
      if (other.length > 0) contentHtml += createSection(pinned.length > 0 ? 'Заметки' : '', other);

      notesContainer.innerHTML = contentHtml;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Open Note: Apple Push Transition
    window.openNote = function(id) {
      currentNoteId = id;
      const note = notes.find(n => n.id === id);
      if (!note) return;

      noteTextarea.value = note.text;
      updateStats();
      applyEditorSettings();

      // Apple push animation: list slides back, detail slides in
      listView.classList.add('list-hidden-back');
      detailView.classList.remove('detail-hidden-right');
      detailView.classList.add('detail-active');

      closeSettings();
    };

    function updateStats() {
      const text = noteTextarea.value;
      const chars = text.length;
      const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

      wordCharStats.textContent = `${words} слов, ${chars} симв.`;
      statChars.textContent = chars;
      statWords.textContent = words;
      statReadingTime.textContent = `~${Math.max(1, Math.round(words / 180))} мин`;

      if (currentNoteId) {
        const note = notes.find(n => n.id === currentNoteId);
        if (note) note.text = text;
      }
    }

    function applyEditorSettings() {
      noteTextarea.style.fontSize = `${settings.fontSize}px`;
      fontSizeDisplay.textContent = `${settings.fontSize} пт`;
      fontSizeSlider.value = settings.fontSize;

      noteTextarea.classList.remove('font-sans', 'font-serif-ios', 'font-mono-ios');
      if (settings.fontStyle === 'serif') noteTextarea.classList.add('font-serif-ios');
      else if (settings.fontStyle === 'mono') noteTextarea.classList.add('font-mono-ios');
      else noteTextarea.classList.add('font-sans');
      fontStyleSelect.value = settings.fontStyle;

      noteTextarea.readOnly = settings.readOnly;
      readOnlyToggle.checked = settings.readOnly;
      if (settings.readOnly) {
        wordCharStats.innerHTML = `<span class="text-orange-500 font-semibold">🔒 Только чтение</span>`;
      } else {
        const text = noteTextarea.value;
        const chars = text.length;
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        wordCharStats.textContent = `${words} слов, ${chars} симв.`;
      }
    }

    // Open/Close Settings Modal with Apple Sheet Physics
    function openSettings() {
      sheetBackdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        sheetBackdrop.classList.remove('opacity-0');
        sheetBackdrop.classList.add('opacity-100');
        settingsSheet.classList.remove('hidden-sheet');
        settingsSheet.classList.add('visible-sheet');
      });
    }

    function closeSettings() {
      settingsSheet.classList.remove('visible-sheet');
      settingsSheet.classList.add('hidden-sheet');
      sheetBackdrop.classList.remove('opacity-100');
      sheetBackdrop.classList.add('opacity-0');
      setTimeout(() => {
        sheetBackdrop.classList.add('hidden');
      }, 350);
    }

    // Drag-down gesture on sheet to dismiss
    let startY = 0;
    let currentY = 0;
    let isDragging = false;

    function handleTouchStart(e) {
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      isDragging = true;
      settingsSheet.style.transition = 'none';
    }

    function handleTouchMove(e) {
      if (!isDragging) return;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      currentY = clientY - startY;
      if (currentY > 0) {
        settingsSheet.style.transform = `translateY(${currentY}px)`;
      }
    }

    function handleTouchEnd() {
      if (!isDragging) return;
      isDragging = false;
      settingsSheet.style.transition = '';
      if (currentY > 70) {
        closeSettings();
      } else {
        settingsSheet.style.transform = 'translateY(0)';
      }
      currentY = 0;
    }

    sheetGrabber.addEventListener('mousedown', handleTouchStart);
    sheetGrabber.addEventListener('touchstart', handleTouchStart, { passive: true });
    window.addEventListener('mousemove', handleTouchMove);
    window.addEventListener('touchmove', handleTouchMove, { passive: true });
    window.addEventListener('mouseup', handleTouchEnd);
    window.addEventListener('touchend', handleTouchEnd);

    sheetBackdrop.addEventListener('click', closeSettings);
    sheetHeader.addEventListener('click', closeSettings);

    // Event Listeners
    searchInput.addEventListener('input', renderNotes);
    noteTextarea.addEventListener('input', updateStats);

    newNoteBtn.addEventListener('click', () => {
      const newId = String(Date.now());
      const newNote = {
        id: newId,
        text: '',
        isPinned: false,
        date: 'Только что'
      };
      notes.unshift(newNote);
      openNote(newId);
      setTimeout(() => noteTextarea.focus(), 250);
    });

    backToListBtn.addEventListener('click', () => {
      if (currentNoteId) {
        const note = notes.find(n => n.id === currentNoteId);
        if (note && note.text.trim() === '') {
          notes = notes.filter(n => n.id !== currentNoteId);
        }
      }
      // Apple pop transition: detail slides away, list returns
      detailView.classList.remove('detail-active');
      detailView.classList.add('detail-hidden-right');
      listView.classList.remove('list-hidden-back');

      closeSettings();
      setTimeout(renderNotes, 200);
    });

    doneEditingBtn.addEventListener('click', () => {
      noteTextarea.blur();
    });

    deleteDetailBtn.addEventListener('click', () => {
      if (confirm('Удалить эту заметку? Это действие нельзя отменить.')) {
        notes = notes.filter(n => n.id !== currentNoteId);
        detailView.classList.remove('detail-active');
        detailView.classList.add('detail-hidden-right');
        listView.classList.remove('list-hidden-back');
        closeSettings();
        setTimeout(renderNotes, 200);
      }
    });

    openSettingsBtn.addEventListener('click', openSettings);

    fontSizeSlider.addEventListener('input', (e) => {
      settings.fontSize = Number(e.target.value);
      applyEditorSettings();
    });

    fontStyleSelect.addEventListener('change', (e) => {
      settings.fontStyle = e.target.value;
      applyEditorSettings();
    });

    readOnlyToggle.addEventListener('change', (e) => {
      settings.readOnly = e.target.checked;
      applyEditorSettings();
    });

    copyAllTextBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(noteTextarea.value).then(() => {
        copyToast.classList.remove('hidden');
        setTimeout(() => copyToast.classList.add('hidden'), 1500);
      });
    });

    cleanWhitespaceBtn.addEventListener('click', () => {
      fixErrorsNotice.classList.remove('hidden');
      setTimeout(() => fixErrorsNotice.classList.add('hidden'), 1500);
    });

    // Theme Toggle (Light / Dark)
    function applyTheme() {
      const listTitleText = document.getElementById('listTitleText');
      const listBottomBar = document.getElementById('listBottomBar');
      const detailNavBar = document.getElementById('detailNavBar');
      const editorFooter = document.getElementById('editorFooter');
      const sheetHeaderTitle = sheetHeader ? sheetHeader.querySelector('h2') : null;

      if (isDarkMode) {
        document.documentElement.style.setProperty('--card-bg', '#2c2c2e');
        document.documentElement.style.setProperty('--border-color', 'rgba(255,255,255,0.08)');
        document.documentElement.style.setProperty('--divider-color', 'rgba(255,255,255,0.06)');
        document.documentElement.style.setProperty('--text-primary', '#ffffff');
        document.documentElement.style.setProperty('--text-secondary', '#a1a1aa');

        document.body.className = "bg-neutral-900 text-neutral-100 flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 transition-colors duration-300";
        screen.className = "relative w-full h-full bg-[#1c1c1e] text-white rounded-[42px] overflow-hidden flex flex-col transition-colors duration-300";
        if (listTitleText) listTitleText.className = "text-[32px] font-bold tracking-tight text-white";
        if (searchInput) searchInput.className = "w-full bg-[#2c2c2e] text-sm text-white placeholder-neutral-400 rounded-xl pl-9 pr-3 py-2 outline-none focus:ring-1 focus:ring-orange-500 transition duration-200";
        if (listBottomBar) listBottomBar.className = "h-16 border-t border-neutral-800/80 px-6 flex items-center justify-center bg-[#1c1c1e]/90 backdrop-blur";
        
        detailView.className = "screen-view detail-hidden-right absolute inset-0 z-20 bg-[#1c1c1e] text-white flex flex-col h-full";
        detailView.style.backgroundColor = '#1c1c1e';
        if (detailNavBar) detailNavBar.className = "pt-10 px-4 pb-2 border-b border-neutral-800/80 flex items-center justify-between bg-[#1c1c1e]/95 backdrop-blur text-white";
        if (noteTextarea) noteTextarea.className = "w-full flex-1 bg-transparent text-white placeholder-neutral-500 outline-none resize-none leading-relaxed tracking-normal font-sans transition-all duration-200";
        if (editorFooter) editorFooter.className = "h-10 px-5 border-t border-neutral-800/80 bg-[#242426] flex items-center justify-between text-[11px] text-neutral-400 font-medium";

        settingsSheet.style.backgroundColor = '#2c2c2e';
        settingsSheet.style.color = '#ffffff';
        if (sheetHeaderTitle) sheetHeaderTitle.className = "text-base font-bold text-white";
        if (fontStyleSelect) fontStyleSelect.className = "bg-[#2c2c2e] text-white text-xs font-medium px-2.5 py-1.5 rounded-lg outline-none border border-neutral-600 focus:border-orange-500 transition";

        document.querySelectorAll('#settingsSheet .bg-\\[\\#1c1c1e\\], #settingsSheet .bg-white').forEach(el => {
          if (el.classList.contains('divide-y') || el.classList.contains('divide-neutral-200') || el.classList.contains('divide-neutral-800')) {
            el.className = "bg-[#1c1c1e] rounded-2xl divide-y divide-neutral-800 border border-neutral-700/40";
          } else if (el.classList.contains('text-xs') || el.id === 'statChars') {
            el.className = "bg-[#1c1c1e] rounded-2xl p-3.5 space-y-2 border border-neutral-700/40 text-xs";
          } else {
            el.className = "bg-[#1c1c1e] rounded-2xl p-3.5 space-y-3.5 border border-neutral-700/40";
          }
        });

        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'Тёмная тема';
      } else {
        document.documentElement.style.setProperty('--card-bg', '#ffffff');
        document.documentElement.style.setProperty('--border-color', 'rgba(0,0,0,0.08)');
        document.documentElement.style.setProperty('--divider-color', 'rgba(0,0,0,0.06)');
        document.documentElement.style.setProperty('--text-primary', '#000000');
        document.documentElement.style.setProperty('--text-secondary', '#000000');

        document.body.className = "bg-[#e5e5ea] text-black flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 transition-colors duration-300";
        screen.className = "relative w-full h-full bg-[#f2f2f7] text-black rounded-[42px] overflow-hidden flex flex-col transition-colors duration-300";
        if (listTitleText) listTitleText.className = "text-[32px] font-bold tracking-tight text-black";
        if (searchInput) searchInput.className = "w-full bg-[#e3e3e8] text-sm text-black placeholder-neutral-500 rounded-xl pl-9 pr-3 py-2 outline-none focus:ring-1 focus:ring-orange-500 transition duration-200";
        if (listBottomBar) listBottomBar.className = "h-16 border-t border-neutral-200/80 px-6 flex items-center justify-center bg-[#f2f2f7]/90 backdrop-blur";
        
        detailView.className = "screen-view detail-hidden-right absolute inset-0 z-20 bg-white text-black flex flex-col h-full";
        detailView.style.backgroundColor = '#ffffff';
        if (detailNavBar) detailNavBar.className = "pt-10 px-4 pb-2 border-b border-neutral-200/80 flex items-center justify-between bg-white/95 backdrop-blur text-black";
        if (noteTextarea) noteTextarea.className = "w-full flex-1 bg-transparent text-black placeholder-neutral-400 outline-none resize-none leading-relaxed tracking-normal font-sans transition-all duration-200";
        if (editorFooter) editorFooter.className = "h-10 px-5 border-t border-neutral-200/80 bg-[#f9f9fb] flex items-center justify-between text-[11px] text-black font-semibold";

        settingsSheet.style.backgroundColor = '#f2f2f7';
        settingsSheet.style.color = '#111827';
        if (sheetHeaderTitle) sheetHeaderTitle.className = "text-base font-bold text-neutral-900";
        if (fontStyleSelect) fontStyleSelect.className = "bg-white text-neutral-900 text-xs font-medium px-2.5 py-1.5 rounded-lg outline-none border border-neutral-300 focus:border-orange-500 transition";

        document.querySelectorAll('#settingsSheet .bg-\\[\\#1c1c1e\\], #settingsSheet .bg-white').forEach(el => {
          if (el.classList.contains('divide-y') || el.classList.contains('divide-neutral-200') || el.classList.contains('divide-neutral-800')) {
            el.className = "bg-white rounded-2xl divide-y divide-neutral-200 border border-neutral-200/80 shadow-sm";
          } else if (el.classList.contains('text-xs') || el.id === 'statChars') {
            el.className = "bg-white rounded-2xl p-3.5 space-y-2 border border-neutral-200/80 text-xs text-neutral-800 shadow-sm";
          } else {
            el.className = "bg-white rounded-2xl p-3.5 space-y-3.5 border border-neutral-200/80 text-neutral-800 shadow-sm";
          }
        });

        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'Светлая тема';
      }
      renderNotes();
    }

    toggleThemeBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      applyTheme();
    });

    resetDemoBtn.addEventListener('click', () => {
      location.reload();
    });

    // Init
    applyTheme();
    renderNotes();
  </script>
</body>
</html>
