<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotesApp Preview - iOS Simulator</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap');

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Plus Jakarta Sans", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .font-serif-ios {
      font-family: "Playfair Display", "New York", Georgia, serif;
    }
    .font-mono-ios {
      font-family: "JetBrains Mono", SFMono-Regular, Menlo, Monaco, monospace;
    }

    /* Custom iOS Transitions */
    .ios-sheet {
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }
    .ios-sheet.hidden-sheet {
      transform: translateY(100%);
      pointer-events: none;
    }
    .ios-sheet.visible-sheet {
      transform: translateY(0);
      pointer-events: auto;
    }

    /* iOS smooth scroll */
    .ios-scroll::-webkit-scrollbar {
      display: none;
    }
    .ios-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-neutral-900 text-neutral-100 flex flex-col items-center justify-center min-h-screen p-4 sm:p-6">

  <!-- Header Controls -->
  <div class="mb-4 flex items-center gap-3 bg-neutral-800/90 border border-neutral-700/60 px-4 py-2 rounded-full shadow-lg backdrop-blur">
    <span class="text-xs font-medium text-neutral-300">Режим симулятора:</span>
    <button id="toggleThemeBtn" class="flex items-center gap-1.5 text-xs bg-neutral-700 hover:bg-neutral-600 px-3 py-1.5 rounded-full transition font-medium">
      <span id="themeIcon">🌙</span> <span id="themeLabel">Тёмная тема</span>
    </button>
    <div class="w-px h-4 bg-neutral-700"></div>
    <button id="resetDemoBtn" class="text-xs text-neutral-400 hover:text-white px-2 py-1 transition">
      Сбросить демо
    </button>
  </div>

  <!-- iPhone Frame Mockup -->
  <div id="phoneCase" class="relative w-[385px] h-[780px] bg-black rounded-[52px] p-[10px] shadow-2xl shadow-black/80 ring-1 ring-white/10 transition-colors duration-300">
    <!-- Physical Side Buttons & Bezel Glow -->
    <div class="absolute -left-[13px] top-[140px] w-[3px] h-[28px] bg-neutral-700 rounded-l-md"></div>
    <div class="absolute -left-[13px] top-[185px] w-[3px] h-[48px] bg-neutral-700 rounded-l-md"></div>
    <div class="absolute -left-[13px] top-[245px] w-[3px] h-[48px] bg-neutral-700 rounded-l-md"></div>
    <div class="absolute -right-[13px] top-[195px] w-[3px] h-[72px] bg-neutral-700 rounded-r-md"></div>

    <!-- Screen Container -->
    <div id="screen" class="relative w-full h-full bg-[#1c1c1e] text-white rounded-[42px] overflow-hidden flex flex-col transition-colors duration-300">

      <!-- Dynamic Island / Status Bar -->
      <div class="relative z-30 pt-3 px-7 flex items-center justify-between text-[13px] font-semibold tracking-tight">
        <span id="clockText">9:41</span>
        <!-- Dynamic Island Pill -->
        <div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-[110px] h-[30px] bg-black rounded-full flex items-center justify-between px-2.5 shadow-md">
          <div class="w-2.5 h-2.5 rounded-full bg-neutral-800"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-[#0a1020] border border-blue-900/30"></div>
        </div>
        <div class="flex items-center gap-1.5">
          <!-- Signal -->
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.2.2-.2.51 0 .71.2.2.51.2.71 0l.64-.64C7.24 19.46 9.49 20.25 12 20.25c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15.5c-3.58 0-6.5-2.92-6.5-6.5S8.42 5.5 12 5.5s6.5 2.92 6.5 6.5-2.92 6.5-6.5 6.5z"/></svg>
          <!-- Wifi -->
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3c3.51 0 6.74 1.34 9.17 3.53L12 19.72 2.83 10.53A13.9 13.9 0 0 1 12 7z"/></svg>
          <!-- Battery -->
          <div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
            <div class="w-full h-full bg-current rounded-2xs"></div>
          </div>
        </div>
      </div>

      <!-- ================= SCREEN 1: LIST VIEW ================= -->
      <div id="listView" class="flex-1 flex flex-col h-full overflow-hidden transition-all duration-300">
        <!-- Top Nav / Large Title -->
        <div class="px-5 pt-4 pb-2">
          <h1 class="text-[32px] font-bold tracking-tight text-white" id="listTitleText">Заметки</h1>
          <!-- Search Bar -->
          <div class="mt-2.5 relative">
            <svg class="absolute left-3 top-2.5 w-4 h-4 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>
            </svg>
            <input id="searchInput" type="text" placeholder="Поиск" class="w-full bg-[#2c2c2e] text-sm text-white placeholder-neutral-400 rounded-xl pl-9 pr-3 py-2 outline-none focus:ring-1 focus:ring-orange-500 transition">
          </div>
        </div>

        <!-- Notes List Scroll Area -->
        <div id="notesContainer" class="flex-1 overflow-y-auto px-4 py-2 space-y-4 ios-scroll">
          <!-- Rendered by JS -->
        </div>

        <!-- Bottom Bar: Notice NO note count, only button on trailing side! -->
        <div class="h-14 border-t border-neutral-800/80 px-6 flex items-center justify-end bg-[#1c1c1e]/90 backdrop-blur" id="listBottomBar">
          <!-- Right: New Note Button -->
          <button id="newNoteBtn" class="text-orange-500 hover:text-orange-400 p-2 rounded-full active:scale-95 transition" title="Создать заметку">
            <svg class="w-6 h-6 stroke-current fill-none stroke-[2]" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- ================= SCREEN 2: DETAIL / EDITOR VIEW ================= -->
      <div id="detailView" class="hidden absolute inset-0 z-20 bg-[#1c1c1e] flex flex-col h-full transition-all duration-300">
        <!-- Top Toolbar -->
        <div class="pt-10 px-4 pb-2 border-b border-neutral-800/80 flex items-center justify-between bg-[#1c1c1e]/95 backdrop-blur" id="detailNavBar">
          <!-- Back Button -->
          <button id="backToListBtn" class="flex items-center gap-1 text-orange-500 hover:text-orange-400 text-sm font-semibold active:opacity-70 transition">
            <svg class="w-5 h-5 stroke-current fill-none stroke-[2.5]" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
            </svg>
            Заметки
          </button>

          <!-- Trailing Toolbar Buttons -->
          <div class="flex items-center gap-3">
            <!-- Settings button (Gear) -->
            <button id="openSettingsBtn" class="text-orange-500 hover:text-orange-400 p-1.5 rounded-full active:scale-95 transition" title="Параметры заметки">
              <svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.869a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>

            <!-- Share button -->
            <button id="shareBtn" class="text-orange-500 hover:text-orange-400 p-1.5 active:scale-95 transition" title="Поделиться">
              <svg class="w-5 h-5 stroke-current fill-none stroke-[2]" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H7.5a2.25 2.25 0 00-2.25 2.25v9a2.25 2.25 0 002.25 2.25h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25H15M12 3v12m0-12l-3 3m3-3l3 3"/>
              </svg>
            </button>

            <!-- Pin button -->
            <button id="pinDetailBtn" class="text-orange-500 hover:text-orange-400 p-1.5 active:scale-95 transition" title="Закрепить">
              <svg id="pinDetailIcon" class="w-5 h-5 stroke-current fill-none stroke-[2]" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"/>
              </svg>
            </button>

            <!-- Trash button -->
            <button id="deleteDetailBtn" class="text-red-500 hover:text-red-400 p-1.5 active:scale-95 transition" title="Удалить">
              <svg class="w-5 h-5 stroke-current fill-none stroke-[2]" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
              </svg>
            </button>

            <!-- Done Button -->
            <button id="doneEditingBtn" class="text-orange-500 hover:text-orange-400 text-sm font-semibold active:opacity-70 transition pl-1">
              Готово
            </button>
          </div>
        </div>

        <!-- Editor Content (Pure Minimal by Default) -->
        <div class="flex-1 p-5 overflow-y-auto flex flex-col relative ios-scroll">
          <textarea id="noteTextarea" placeholder="Начните писать..." class="w-full flex-1 bg-transparent text-white placeholder-neutral-500 outline-none resize-none leading-relaxed tracking-normal font-sans" style="font-size: 17px;"></textarea>
        </div>

        <!-- Footer Bar: Minimal Word Count & Last Modified -->
        <div id="editorFooter" class="h-10 px-5 border-t border-neutral-800/80 bg-[#242426] flex items-center justify-between text-[11px] text-neutral-400 font-medium">
          <span id="wordCharStats">0 слов, 0 симв.</span>
          <span id="dateModifiedText">Изменено только что</span>
        </div>
      </div>

      <!-- ================= MODAL SHEET: ADVANCED SETTINGS ================= -->
      <div id="settingsSheet" class="ios-sheet hidden-sheet absolute inset-x-0 bottom-0 top-[60px] z-40 bg-[#2c2c2e] rounded-t-[32px] shadow-2xl flex flex-col overflow-hidden border-t border-neutral-700/50">
        <!-- Sheet Grabber -->
        <div class="pt-2.5 pb-2 flex justify-center">
          <div class="w-9 h-1 bg-neutral-500/50 rounded-full"></div>
        </div>

        <!-- Sheet Header (Clean, swipe to dismiss) -->
        <div class="px-5 py-2.5 flex items-center justify-between border-b border-neutral-750 cursor-pointer" id="sheetHeader">
          <h2 class="text-base font-bold text-white">Параметры заметки</h2>
          <span class="text-[11px] text-neutral-400">Смахните вниз</span>
        </div>

        <!-- Sheet Form Items -->
        <div class="flex-1 overflow-y-auto px-4 py-3 space-y-4 ios-scroll text-sm">

          <!-- Section: Typography -->
          <div>
            <div class="text-[11px] uppercase tracking-wider text-neutral-400 font-semibold px-2 mb-1.5">Оформление текста</div>
            <div class="bg-[#1c1c1e] rounded-2xl p-3 space-y-3 border border-neutral-700/40">
              <!-- Font Style Selector -->
              <div class="flex items-center justify-between">
                <span class="text-neutral-200">Стиль шрифта</span>
                <select id="fontStyleSelect" class="bg-[#2c2c2e] text-white text-xs font-medium px-2.5 py-1.5 rounded-lg outline-none border border-neutral-600">
                  <option value="sans">Стандартный</option>
                  <option value="serif">С засечками</option>
                  <option value="mono">Моноширинный</option>
                </select>
              </div>

              <!-- Font Size Slider -->
              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-neutral-300">Размер шрифта</span>
                  <span id="fontSizeDisplay" class="text-neutral-400 font-mono">17 пт</span>
                </div>
                <input id="fontSizeSlider" type="range" min="14" max="28" value="17" class="w-full accent-orange-500 cursor-pointer">
              </div>

              <!-- Read Only Toggle -->
              <div class="flex items-center justify-between pt-1 border-t border-neutral-800">
                <div>
                  <div class="text-neutral-200 text-xs font-medium">Режим чтения</div>
                  <div class="text-[11px] text-neutral-400">Защита от случайных правок</div>
                </div>
                <input id="readOnlyToggle" type="checkbox" class="w-5 h-5 accent-orange-500 rounded cursor-pointer">
              </div>
            </div>
          </div>

          <!-- Section: Actions -->
          <div>
            <div class="text-[11px] uppercase tracking-wider text-neutral-400 font-semibold px-2 mb-1.5">Действия</div>
            <div class="bg-[#1c1c1e] rounded-2xl divide-y divide-neutral-800 border border-neutral-700/40">
              <button id="copyAllTextBtn" class="w-full px-3.5 py-2.5 flex items-center justify-between text-neutral-200 hover:bg-neutral-800/50 transition rounded-t-2xl text-left">
                <span class="flex items-center gap-2">
                  <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/></svg>
                  Скопировать весь текст
                </span>
                <span id="copyToast" class="text-xs text-green-400 font-medium hidden">Скопировано!</span>
              </button>

              <button id="cleanWhitespaceBtn" class="w-full px-3.5 py-2.5 flex items-center justify-between text-neutral-200 hover:bg-neutral-800/50 transition rounded-b-2xl text-left">
                <span class="flex items-center gap-2">
                  <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  Исправить ошибки в тексте
                </span>
                <span id="fixErrorsNotice" class="text-xs text-orange-400 font-medium hidden">Скоро настроим</span>
              </button>
            </div>
          </div>

          <!-- Section: Details Stats -->
          <div>
            <div class="text-[11px] uppercase tracking-wider text-neutral-400 font-semibold px-2 mb-1.5">Информация</div>
            <div class="bg-[#1c1c1e] rounded-2xl p-3 space-y-1.5 border border-neutral-700/40 text-xs">
              <div class="flex justify-between text-neutral-300">
                <span>Символов:</span>
                <span id="statChars" class="font-mono text-neutral-400">0</span>
              </div>
              <div class="flex justify-between text-neutral-300">
                <span>Слов:</span>
                <span id="statWords" class="font-mono text-neutral-400">0</span>
              </div>
              <div class="flex justify-between text-neutral-300">
                <span>Время чтения:</span>
                <span id="statReadingTime" class="text-neutral-400">~1 мин</span>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Home Indicator Bar -->
      <div class="pb-2 pt-1 flex justify-center">
        <div class="w-32 h-1 bg-neutral-500/40 rounded-full"></div>
      </div>

    </div>
  </div>

  <script>
    // State
    let isDarkMode = true;
    let currentNoteId = null;
    let notes = [
      {
        id: "1",
        text: "Добро пожаловать в Заметки ✨\n\nЭто минималистичное и быстрое приложение:\n\n• Первая строка автоматически становится заголовком.\n• Свайп вправо закрепляет заметку.\n• Свайп влево удаляет заметку.\n• Все данные хранятся локально.",
        isPinned: true,
        date: "14:20"
      },
      {
        id: "2",
        text: "Список покупок к выходным\n\n1. Молоко овсяное\n2. Свежий кофе в зернах\n3. Сыр пармезан\n4. Зелень и руккола",
        isPinned: false,
        date: "Вчера"
      },
      {
        id: "3",
        text: "Идеи для нового проекта\n\nСделать красивый предпросмотр в стиле iPhone для быстрой оценки дизайна и эргономики.",
        isPinned: false,
        date: "9 окт"
      }
    ];

    // Settings State
    let settings = {
      fontStyle: 'sans',
      fontSize: 17,
      readOnly: false
    };

    // DOM Elements
    const screen = document.getElementById('screen');
    const listView = document.getElementById('listView');
    const detailView = document.getElementById('detailView');
    const settingsSheet = document.getElementById('settingsSheet');
    const notesContainer = document.getElementById('notesContainer');
    const searchInput = document.getElementById('searchInput');
    const noteTextarea = document.getElementById('noteTextarea');
    const wordCharStats = document.getElementById('wordCharStats');
    const dateModifiedText = document.getElementById('dateModifiedText');
    const pinDetailBtn = document.getElementById('pinDetailBtn');
    const pinDetailIcon = document.getElementById('pinDetailIcon');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const fontStyleSelect = document.getElementById('fontStyleSelect');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeDisplay = document.getElementById('fontSizeDisplay');
    const readOnlyToggle = document.getElementById('readOnlyToggle');
    const copyAllTextBtn = document.getElementById('copyAllTextBtn');
    const copyToast = document.getElementById('copyToast');
    const cleanWhitespaceBtn = document.getElementById('cleanWhitespaceBtn');
    const statChars = document.getElementById('statChars');
    const statWords = document.getElementById('statWords');
    const statReadingTime = document.getElementById('statReadingTime');
    const toggleThemeBtn = document.getElementById('toggleThemeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    const newNoteBtn = document.getElementById('newNoteBtn');
    const backToListBtn = document.getElementById('backToListBtn');
    const deleteDetailBtn = document.getElementById('deleteDetailBtn');
    const doneEditingBtn = document.getElementById('doneEditingBtn');
    const resetDemoBtn = document.getElementById('resetDemoBtn');

    // Render Note List
    function renderNotes() {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = notes.filter(n => n.text.toLowerCase().includes(query));

      const pinned = filtered.filter(n => n.isPinned);
      const other = filtered.filter(n => !n.isPinned);

      notesContainer.innerHTML = '';

      if (filtered.length === 0) {
        notesContainer.innerHTML = `
          <div class="py-16 flex flex-col items-center justify-center text-neutral-500">
            <svg class="w-12 h-12 stroke-[1.2] stroke-current fill-none mb-2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
            </svg>
            <span class="text-sm font-medium">Ничего не найдено</span>
          </div>
        `;
        return;
      }

      function createSection(title, list) {
        if (list.length === 0) return '';
        let html = `<div>`;
        if (title) {
          html += `<div class="text-[11px] font-semibold tracking-wide text-neutral-400 uppercase px-2 mb-1.5">${title}</div>`;
        }
        html += `<div class="bg-[var(--card-bg)] rounded-2xl divide-y divide-[var(--divider-color)] overflow-hidden shadow-sm border border-[var(--border-color)]">`;
        list.forEach(note => {
          const lines = note.text.split('\n').filter(l => l.trim().length > 0);
          const noteTitle = lines[0] || 'Новая заметка';
          const noteBody = lines[1] || 'Нет дополнительного текста';

          html += `
            <div onclick="openNote('${note.id}')" class="p-3.5 hover:bg-neutral-800/40 active:bg-neutral-700/50 cursor-pointer transition flex items-start justify-between group">
              <div class="flex-1 min-w-0 pr-3">
                <div class="flex items-center gap-1.5">
                  ${note.isPinned ? '<span class="text-orange-500 text-xs">📌</span>' : ''}
                  <span class="font-semibold text-sm text-[var(--text-primary)] truncate">${escapeHtml(noteTitle)}</span>
                </div>
                <div class="flex items-center gap-2 text-xs text-[var(--text-secondary)] mt-1 truncate">
                  <span class="font-medium shrink-0">${note.date}</span>
                  <span class="truncate">${escapeHtml(noteBody)}</span>
                </div>
              </div>
              <span class="text-neutral-500 text-xs font-bold pt-1">›</span>
            </div>
          `;
        });
        html += `</div></div>`;
        return html;
      }

      let contentHtml = '';
      if (pinned.length > 0) contentHtml += createSection('Закреплённые', pinned);
      if (other.length > 0) contentHtml += createSection(pinned.length > 0 ? 'Заметки' : '', other);

      notesContainer.innerHTML = contentHtml;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Open Note in Editor
    window.openNote = function(id) {
      currentNoteId = id;
      const note = notes.find(n => n.id === id);
      if (!note) return;

      noteTextarea.value = note.text;
      updateStats();
      applyEditorSettings();

      // Update Pin Icon
      updatePinIcon(note.isPinned);

      // Transition to Detail
      detailView.classList.remove('hidden');
      closeSettings();
    };

    function updatePinIcon(isPinned) {
      if (isPinned) {
        pinDetailIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" fill="currentColor" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"/>`;
      } else {
        pinDetailIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" fill="none" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"/>`;
      }
    }

    function updateStats() {
      const text = noteTextarea.value;
      const chars = text.length;
      const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

      wordCharStats.textContent = `${words} слов, ${chars} симв.`;
      statChars.textContent = chars;
      statWords.textContent = words;
      statReadingTime.textContent = `~${Math.max(1, Math.round(words / 180))} мин`;

      // Save to note
      if (currentNoteId) {
        const note = notes.find(n => n.id === currentNoteId);
        if (note) note.text = text;
      }
    }

    // Apply Settings to Textarea
    function applyEditorSettings() {
      noteTextarea.style.fontSize = `${settings.fontSize}px`;
      fontSizeDisplay.textContent = `${settings.fontSize} пт`;
      fontSizeSlider.value = settings.fontSize;

      noteTextarea.classList.remove('font-sans', 'font-serif-ios', 'font-mono-ios');
      if (settings.fontStyle === 'serif') noteTextarea.classList.add('font-serif-ios');
      else if (settings.fontStyle === 'mono') noteTextarea.classList.add('font-mono-ios');
      else noteTextarea.classList.add('font-sans');
      fontStyleSelect.value = settings.fontStyle;

      noteTextarea.readOnly = settings.readOnly;
      readOnlyToggle.checked = settings.readOnly;
      if (settings.readOnly) {
        wordCharStats.innerHTML = `<span class="text-orange-500 font-semibold">🔒 Только чтение</span>`;
      } else {
        const text = noteTextarea.value;
        const chars = text.length;
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        wordCharStats.textContent = `${words} слов, ${chars} симв.`;
      }
    }

    // Open/Close Settings Sheet
    function openSettings() {
      settingsSheet.classList.remove('hidden-sheet');
      settingsSheet.classList.add('visible-sheet');
    }

    function closeSettings() {
      settingsSheet.classList.remove('visible-sheet');
      settingsSheet.classList.add('hidden-sheet');
    }

    // Event Listeners
    searchInput.addEventListener('input', renderNotes);
    noteTextarea.addEventListener('input', updateStats);

    newNoteBtn.addEventListener('click', () => {
      const newId = String(Date.now());
      const newNote = {
        id: newId,
        text: '',
        isPinned: false,
        date: 'Только что'
      };
      notes.unshift(newNote);
      openNote(newId);
      setTimeout(() => noteTextarea.focus(), 150);
    });

    backToListBtn.addEventListener('click', () => {
      // Clean empty note
      if (currentNoteId) {
        const note = notes.find(n => n.id === currentNoteId);
        if (note && note.text.trim() === '') {
          notes = notes.filter(n => n.id !== currentNoteId);
        }
      }
      detailView.classList.add('hidden');
      closeSettings();
      renderNotes();
    });

    doneEditingBtn.addEventListener('click', () => {
      noteTextarea.blur();
    });

    deleteDetailBtn.addEventListener('click', () => {
      if (confirm('Удалить эту заметку? Это действие нельзя отменить.')) {
        notes = notes.filter(n => n.id !== currentNoteId);
        detailView.classList.add('hidden');
        closeSettings();
        renderNotes();
      }
    });

    pinDetailBtn.addEventListener('click', () => {
      if (!currentNoteId) return;
      const note = notes.find(n => n.id === currentNoteId);
      if (note) {
        note.isPinned = !note.isPinned;
        updatePinIcon(note.isPinned);
        renderNotes();
      }
    });

    openSettingsBtn.addEventListener('click', openSettings);
    document.getElementById('sheetHeader')?.addEventListener('click', closeSettings);

    fontSizeSlider.addEventListener('input', (e) => {
      settings.fontSize = Number(e.target.value);
      applyEditorSettings();
    });

    fontStyleSelect.addEventListener('change', (e) => {
      settings.fontStyle = e.target.value;
      applyEditorSettings();
    });

    readOnlyToggle.addEventListener('change', (e) => {
      settings.readOnly = e.target.checked;
      applyEditorSettings();
    });

    copyAllTextBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(noteTextarea.value).then(() => {
        copyToast.classList.remove('hidden');
        setTimeout(() => copyToast.classList.add('hidden'), 1500);
      });
    });

    const fixErrorsNotice = document.getElementById('fixErrorsNotice');
    cleanWhitespaceBtn.addEventListener('click', () => {
      fixErrorsNotice.classList.remove('hidden');
      setTimeout(() => fixErrorsNotice.classList.add('hidden'), 1500);
    });

    // Theme Toggle (Light / Dark)
    function applyTheme() {
      if (isDarkMode) {
        document.documentElement.style.setProperty('--card-bg', '#2c2c2e');
        document.documentElement.style.setProperty('--border-color', 'rgba(255,255,255,0.08)');
        document.documentElement.style.setProperty('--divider-color', 'rgba(255,255,255,0.06)');
        document.documentElement.style.setProperty('--text-primary', '#ffffff');
        document.documentElement.style.setProperty('--text-secondary', '#a1a1aa');

        screen.className = "relative w-full h-full bg-[#1c1c1e] text-white rounded-[42px] overflow-hidden flex flex-col transition-colors duration-300";
        detailView.style.backgroundColor = '#1c1c1e';
        settingsSheet.style.backgroundColor = '#2c2c2e';
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'Тёмная тема';
      } else {
        document.documentElement.style.setProperty('--card-bg', '#ffffff');
        document.documentElement.style.setProperty('--border-color', 'rgba(0,0,0,0.08)');
        document.documentElement.style.setProperty('--divider-color', 'rgba(0,0,0,0.06)');
        document.documentElement.style.setProperty('--text-primary', '#111827');
        document.documentElement.style.setProperty('--text-secondary', '#6b7280');

        screen.className = "relative w-full h-full bg-[#f2f2f7] text-neutral-900 rounded-[42px] overflow-hidden flex flex-col transition-colors duration-300";
        detailView.style.backgroundColor = '#ffffff';
        settingsSheet.style.backgroundColor = '#f2f2f7';
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'Светлая тема';
      }
      renderNotes();
    }

    toggleThemeBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      applyTheme();
    });

    resetDemoBtn.addEventListener('click', () => {
      location.reload();
    });

    // Init
    applyTheme();
    renderNotes();
  </script>
</body>
</html>
